
{% extends "base.html" %}

{% block title %}MY PROFILE | CAREPOINT HOSPITAL{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-4">
        <h2 class="fw-bold">My Profile</h2>
        <p class="text-muted">Manage your personal information</p>
    </div>

    <div class="card border-0 shadow-sm mx-auto"
         style="max-width: 650px; border-radius: 15px;">

        <div class="card-body p-4">

            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                     style="width: 85px; height: 85px; font-size: 32px;">
                    👤
                </div>
                <h4 class="mt-3 fw-bold">Patient Profile</h4>
                <p class="text-muted">Personal Details</p>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control"
                       placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control"
                       placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input type="tel" class="form-control"
                       placeholder="Enter your phone number">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Date of Birth</label>
                <input type="date" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Address</label>
                <textarea class="form-control" rows="3"
                          placeholder="Enter your address"></textarea>
            </div>

            <button class="btn btn-primary w-100 py-2">
                Save Profile
            </button>

        </div>
    </div>
</div>

{% endblock %}
